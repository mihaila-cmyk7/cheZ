<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Шахматы на троих</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/game.js"></script>
<script src="/layout.js"></script>
<script src="/tgame.js"></script>
<style>
  :root { --bg: var(--tg-theme-bg-color, #16181d); --fg: var(--tg-theme-text-color, #eceff4);
          --hint: var(--tg-theme-hint-color, #8b93a1); --btn: var(--tg-theme-button-color, #3d8bfd);
          --btnfg: var(--tg-theme-button-text-color, #fff); --card: var(--tg-theme-secondary-bg-color, #22252c); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { min-height: 100%; background: var(--bgfill, var(--bg)); background-attachment: fixed; }
  body { margin: 0; min-height: 100vh; background: transparent; color: var(--fg);
         font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  #app { max-width: 560px; margin: 0 auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 100vh; }
  #top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #top .brand { font-weight: 700; font-size: 15px; }
  #top .btns { display: flex; gap: 6px; }
  #seats { display: none; gap: 6px; }
  .chip { flex: 1; min-width: 0; background: var(--card); border-radius: 10px; padding: 6px 8px; font-size: 13px;
          display: flex; align-items: center; gap: 6px; border: 2px solid transparent; }
  .chip.turn { border-color: var(--btn); }
  .chip.dead { opacity: .45; text-decoration: line-through; }
  .chip .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; border: 1.5px solid rgba(128,128,128,.7); }
  .chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status { text-align: center; font-size: 15px; min-height: 22px; }
  #status.warn { color: #ff6b5e; font-weight: 600; }
  #boardWrap { display: flex; justify-content: center; }
  #boardWrap svg { width: 100%; height: auto; max-height: calc(100vh - 190px); touch-action: manipulation; user-select: none; }
  svg .np { pointer-events: none; }
  .card { background: var(--card); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  #menu { text-align: center; margin-top: 6px; }
  #menu h2 { margin: 0; font-size: 22px; }
  #menu .sub { color: var(--hint); font-size: 14px; margin-top: -6px; }
  #menu .or { color: var(--hint); font-size: 13px; }
  #menu .row { display: flex; gap: 8px; }
  #menu input { flex: 1; min-width: 0; background: rgba(128,128,128,.18); color: var(--fg); border: 0; border-radius: 10px; padding: 11px 12px; font-size: 15px; }
  #menu input::placeholder { color: var(--hint); }
  #lobby { text-align: center; display: none; }
  #lobby .code { font-size: 30px; letter-spacing: 6px; font-weight: 700; }
  #lobby .hint { color: var(--hint); font-size: 14px; }
  #actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  button { background: var(--btn); color: var(--btnfg); border: 0; border-radius: 10px; padding: 11px 18px; font-size: 15px; font-weight: 600; font-family: inherit; }
  button.sec { background: var(--card); color: var(--fg); }
  button.big { width: 100%; padding: 14px 18px; font-size: 16px; }
  button.ic { padding: 7px 12px; font-size: 13px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 5; padding: 14px; }
  #promo .box { background: var(--card, #22252c); border-radius: 14px; padding: 14px; display: flex; gap: 10px; }
  #promo button { font-size: 34px; padding: 6px 14px; background: #e9d8b4; color: #222; }
  .sheet { background: var(--tg-theme-bg-color, #22252c); color: var(--tg-theme-text-color, #eceff4); border-radius: 16px; padding: 16px; width: 100%; max-width: 540px;
           max-height: 88vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .sheet h3 { margin: 0; font-size: 18px; }
  .sheet h4 { margin: 10px 0 2px; font-size: 15px; }
  .sheet p, .sheet li { font-size: 14.5px; line-height: 1.42; margin: 4px 0; }
  .sheet ul { margin: 4px 0; padding-left: 20px; }
  .sheet .note { color: var(--tg-theme-hint-color, #8b93a1); font-size: 13px; }
  .fig { text-align: center; font-size: 12.5px; color: var(--tg-theme-hint-color, #8b93a1); display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 6px 0; }
  .fig svg { width: 100%; max-width: 440px; height: auto; }
  .sws { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .sw { height: 56px; border-radius: 12px; border: 3px solid transparent; font-size: 14px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,.35); color: #fff; }
  .sw.light { color: #1c1f26; text-shadow: none; }
  .sw.on { border-color: var(--btn); }
  .cust { display: flex; align-items: center; justify-content: space-between; font-size: 14px; gap: 10px; }
  .cust input { width: 64px; height: 38px; border: 0; padding: 0; background: none; }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #000c; color: #fff; padding: 9px 14px;
           border-radius: 10px; font-size: 14px; display: none; z-index: 9; max-width: 90%; text-align: center; }
  #offline { display: none; text-align: center; color: #ff6b5e; font-size: 13px; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; background: var(--card); color: var(--fg); border: 2px solid transparent; padding: 9px 8px; font-size: 14px; }
  .seg button.on { border-color: var(--btn); }
  .seg small { display: block; font-weight: 400; opacity: .7; font-size: 11.5px; margin-top: 2px; }
  #boardWrap.d3 { touch-action: none; cursor: grab; }
  #chat { display: none; flex-direction: column; gap: 8px; padding: 10px; }
  #chatLog { max-height: 150px; overflow-y: auto; font-size: 14px; display: flex; flex-direction: column; gap: 4px; text-align: left; }
  #chatLog .cm { word-break: break-word; }
  #chatLog .cd { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; border: 1px solid rgba(128,128,128,.7); }
  #chat .row { display: flex; gap: 6px; }
  #chat input { flex: 1; min-width: 0; background: rgba(128,128,128,.18); color: var(--fg); border: 0; border-radius: 10px; padding: 9px 11px; font-size: 15px; }
  #chat .hint { color: var(--hint); font-size: 13px; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="brand">♟ Шахматы на троих</div>
    <div class="btns">
      <button class="sec ic" id="bRules">Правила</button>
      <button class="sec ic" id="bView">3D</button>
      <button class="sec ic" id="bBg">Фон</button>
    </div>
  </div>

  <div id="menu" class="card">
    <h2>Новая партия</h2>
    <div class="sub">Выберите доску и способ игры</div>
    <div class="seg" id="boardSel">
      <button data-b="sectors">Доска «На троих»<small>3 сектора, кольца</small></button>
      <button data-b="t">Доска «Т»<small>квадратные клетки</small></button>
    </div>
    <button class="big" id="mBots">🤖 Играть с ботами</button>
    <button class="big" id="mCreate">👥 Создать игру с друзьями</button>
    <div class="or">или присоединитесь к игре друзей</div>
    <div class="row">
      <input id="joinIn" placeholder="Ссылка или код комнаты" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="joinBtn">Войти</button>
    </div>
  </div>

  <div id="seats"></div>
  <div id="offline">Нет соединения, переподключаюсь…</div>
  <div id="status"></div>
  <div id="boardWrap"></div>
  <div id="lobby" class="card"></div>
  <div id="chat" class="card"><div id="chatLog"></div><div class="row"><input id="chatIn" maxlength="200" placeholder="Сообщение…" autocomplete="off"><button id="chatSend">➤</button></div></div>
  <div id="actions"></div>
</div>

<div id="promo" class="overlay"><div class="box"></div></div>
<div id="modal" class="overlay"><div class="sheet"><h3 id="mt"></h3><div id="mb"></div><button id="mc">Закрыть</button></div></div>
<div id="toast"></div>

<script>
(() => {
  const tg = window.Telegram && Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  const params = new URLSearchParams(location.search);
  const linkRoom = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || params.get('room') || null;
  let devId = null;
  try { devId = sessionStorage.getItem('devId'); } catch (e) {}
  if (!devId) { devId = Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem('devId', devId); } catch (e) {} }
  const devName = params.get('name') || 'Игрок ' + devId.slice(0, 3);

  const COLORS = ['#f3efe6', '#d8483d', '#2a2a2e'];
  const STROKE = ['#222', '#4a0d08', '#e6e6e6'];
  const NAMES = ['белые', 'красные', 'чёрные'];
  const DEAD = '#8a8f98';
  const DEF_COLORS = COLORS.slice(), DEF_STROKE = STROKE.slice(), DEF_FIELD = COLORS.slice(), FIELD = COLORS.slice();
  const strokeFor = (hex) => { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255 > 0.5 ? '#222' : '#eee'; };
  function applyColors(cols) {
    for (let p = 0; p < 3; p++) {
      const c = cols && cols[p];
      COLORS[p] = (c && c.piece) || DEF_COLORS[p];
      STROKE[p] = c && c.piece ? strokeFor(c.piece) : DEF_STROKE[p];
      FIELD[p] = (c && c.field) || DEF_FIELD[p];
    }
  }
  function withDefaults(fn) {
    const a = COLORS.slice(), b = STROKE.slice(), c = FIELD.slice();
    COLORS.splice(0, 3, ...DEF_COLORS); STROKE.splice(0, 3, ...DEF_STROKE); FIELD.splice(0, 3, ...DEF_FIELD);
    try { return fn(); } finally { COLORS.splice(0, 3, ...a); STROKE.splice(0, 3, ...b); FIELD.splice(0, 3, ...c); }
  }

  // ---- вид 3D: проекция точек доски с наклоном и поворотом
  let v3 = { on: false, yaw: 0, pitch: 0.95 };
  try { const j = JSON.parse(localStorage.getItem('chess3v3') || 'null'); if (j) v3 = Object.assign(v3, j); } catch (e) {}
  const saveV3 = () => { try { localStorage.setItem('chess3v3', JSON.stringify(v3)); } catch (e) {} };
  function makeProj(all, v) {
    let cx = 0, cy = 0;
    for (const [x, y] of all) { cx += x; cy += y; }
    cx /= all.length; cy /= all.length;
    let R = 0;
    for (const [x, y] of all) R = Math.max(R, Math.hypot(x - cx, y - cy));
    const D = 3.4 * R, cp = Math.cos(v.pitch), sp = Math.sin(v.pitch);
    const mk = (yaw) => { const c = Math.cos(yaw), s = Math.sin(yaw);
      return (x, y) => { const dx = x - cx, dy = y - cy, u = dx * c - dy * s, w = dx * s + dy * c, z = w * sp, k = D / (D - z); return [u * k, w * cp * k, k, z]; }; };
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let i = 0; i < 16; i++) { const f = mk(i * Math.PI / 8); for (const [x, y] of all) { const q = f(x, y); x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); } }
    y0 -= R * 0.14;
    return { f: mk(v.yaw), vb: [x0, y0, x1 - x0, y1 - y0], cp, sp };
  }
  const GLYPH = { K: '♚', Q: '♛', R: '♜', B: '♝', N: '♞', P: '♟' };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let st = null, ws = null, joinMsg = null, sel = -1, legal = {};
  const GT = window.Chess3T;
  let board = 'sectors'; // выбранная на старте доска
  try { const b = localStorage.getItem('chess3board'); if (b === 't' || b === 'sectors') board = b; } catch (e) {}
  const curVariant = () => (st ? st.variant : board);
  function markBoard() { document.querySelectorAll('#boardSel button').forEach((b) => b.classList.toggle('on', b.dataset.b === board)); }
  document.querySelectorAll('#boardSel button').forEach((b) => { b.onclick = () => { board = b.dataset.b; try { localStorage.setItem('chess3board', board); } catch (e) {} markBoard(); }; });
  markBoard();

  // ================= карта =================
  // Клетки и их соседство берутся из game.js, положение клеток на плоскости — из layout.js
  // (одно и то же на клиенте, сервере и в схемах правил).
  const G = window.Chess3, LAY = window.Chess3Layout;
  const UNIT = 5; // одна клетка ≈ 1 единица карты
  const cidx = G.cid;

  function polys(view) {
    return LAY.get().poly.map((q) => {
      const pts = q.map((p) => { const r = LAY.rot(p, view); return [r[0] * UNIT, -r[1] * UNIT]; });
      let a = 0;
      for (let k = 0; k < 4; k++) { const u = pts[k], w = pts[(k + 1) & 3]; a += u[0] * w[1] - w[0] * u[1]; }
      return {
        pts, sz: Math.sqrt(Math.abs(a) / 2),
        ctr: [(pts[0][0] + pts[1][0] + pts[2][0] + pts[3][0]) / 4, (pts[0][1] + pts[1][1] + pts[2][1] + pts[3][1]) / 4],
      };
    });
  }

  /* Рисует карту. o: view, S, pieces[96] ('0K'…), alive, last{from,to}, sel, targets[{c,cap}], check[],
     marks[{c,color,kind}], interactive, pad, decor(S, view, P) -> svg-строка */
  function mapSvg(o) {
    const view = o.view || 0, S = o.S || 30;
    let P = polys(view), prj = null;
    if (o.d3) {
      prj = makeProj([].concat(...P.map((q) => q.pts)), v3);
      P = P.map((q) => { const pts = q.pts.map(([x, y]) => prj.f(x, y)), c = prj.f(q.ctr[0], q.ctr[1]);
        return { pts, ctr: [c[0], c[1]], sz: q.sz * c[2], s: c[2], z: c[3] }; });
    }
    const sq = prj ? prj.cp : 1;
    let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
    for (const q of P) for (const [x, y] of q.pts) { minx = Math.min(minx, x); miny = Math.min(miny, y); maxx = Math.max(maxx, x); maxy = Math.max(maxy, y); }
    if (prj) { minx = prj.vb[0]; miny = prj.vb[1]; maxx = minx + prj.vb[2]; maxy = miny + prj.vb[3]; }
    const pad = o.pad === undefined ? 0.4 : o.pad;
    const vx = (minx - pad) * S, vy = (miny - pad) * S, vw = (maxx - minx + 2 * pad) * S, vh = (maxy - miny + 2 * pad) * S;
    const pts = (q) => q.pts.map(([x, y]) => `${(x * S).toFixed(1)},${(y * S).toFixed(1)}`).join(' ');
    const sc = (c) => [P[c].ctr[0] * S, P[c].ctr[1] * S];
    const rs = (c, k) => S * Math.min(k, k * P[c].sz); // размеры значков подгоняются под размер клетки
    let base = '', over = '', pcs = '';
    for (let c = 0; c < 96; c++) {
      const a = G.secOf(c), dark = (G.fileOf(c) + G.rankOf(c)) % 2;
      base += `<polygon ${o.interactive ? `data-c="${c}"` : ''} points="${pts(P[c])}" fill="${dark ? '#b58863' : '#ecd9b6'}" stroke="rgba(0,0,0,.45)" stroke-width=".7" stroke-linejoin="round"/>`;
      base += `<polygon class="np" points="${pts(P[c])}" fill="${FIELD[a]}" opacity=".3"/>`;
    }
    if (o.last) for (const c of [o.last.from, o.last.to]) over += `<polygon class="np" points="${pts(P[c])}" fill="#ffe04d" opacity=".5"/>`;
    if (o.sel !== undefined && o.sel >= 0) over += `<polygon class="np" points="${pts(P[o.sel])}" fill="none" stroke="#2f80ed" stroke-width="3" stroke-linejoin="round"/>`;
    if (o.check) {
      (o.pieces || []).forEach((pc, c) => {
        if (pc && pc[1] === 'K' && o.check[+pc[0]] && o.alive[+pc[0]]) { const [x, y] = sc(c); over += `<ellipse class="np" cx="${x}" cy="${y}" rx="${rs(c, 0.45)}" ry="${(rs(c, 0.45)) * sq}" fill="#ff3b30" opacity=".55"/>`; }
      });
    }
    for (const m of o.marks || []) {
      const [x, y] = sc(m.c);
      if (m.kind === 'star') over += `<text class="np" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="${rs(m.c, 0.85)}" fill="${m.color}" stroke="#fff" stroke-width="2" paint-order="stroke">★</text>`;
      else if (m.kind === 'ring') over += `<ellipse class="np" cx="${x}" cy="${y}" rx="${rs(m.c, 0.4)}" ry="${(rs(m.c, 0.4)) * sq}" fill="none" stroke="${m.color}" stroke-width="3"/>`;
      else over += `<ellipse class="np" cx="${x}" cy="${y}" rx="${rs(m.c, 0.2)}" ry="${(rs(m.c, 0.2)) * sq}" fill="${m.color}" stroke="#fff" stroke-width="1.3"/>`;
    }
    for (const t of o.targets || []) {
      const [x, y] = sc(t.c);
      over += t.cap ? `<ellipse class="np" cx="${x}" cy="${y}" rx="${rs(t.c, 0.42)}" ry="${(rs(t.c, 0.42)) * sq}" fill="none" stroke="#2f80ed" stroke-width="3.5"/>`
                    : `<ellipse class="np" cx="${x}" cy="${y}" rx="${rs(t.c, 0.2)}" ry="${(rs(t.c, 0.2)) * sq}" fill="#2f80ed" opacity=".85"/>`;
    }
    const order = [...Array(96).keys()];
    if (prj) order.sort((p, q) => P[p].z - P[q].z);
    for (const c of order) {
      const pc = o.pieces && o.pieces[c];
      if (!pc) continue;
      const ow = +pc[0], [x, by] = sc(c), dead = o.alive && !o.alive[ow];
      let y = by;
      if (prj) { y -= S * prj.sp * P[c].s * 0.4; pcs += `<ellipse class="np" cx="${x}" cy="${by}" rx="${rs(c, 0.3)}" ry="${rs(c, 0.3) * sq}" fill="#000" opacity=".3"/>`; }
      pcs += `<text class="np" x="${x}" y="${y + 1}" text-anchor="middle" dominant-baseline="central" font-size="${rs(c, 0.85 * (o.ps || 1))}"
        fill="${dead ? DEAD : COLORS[ow]}" stroke="${dead ? '#444' : STROKE[ow]}" stroke-width="1.2" paint-order="stroke">${GLYPH[pc[1]]}︎</text>`;
    }
    const dec = o.decor ? o.decor(S, view, P) : '';
    return `<svg viewBox="${vx.toFixed(1)} ${vy.toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}" xmlns="http://www.w3.org/2000/svg">${base}${over}${dec}${pcs}</svg>`;
  }

  // ================= сеть =================
  function stopConn() { const s = ws; ws = null; if (s) { s.onclose = null; try { s.close(); } catch (e) {} } }
  function startJoin(opts) { stopConn(); st = null; sel = -1; chat = []; unread = 0; applyColors(null); joinMsg = opts; render(); connect(); }
  function toMenu() { stopConn(); st = null; sel = -1; joinMsg = null; chat = []; unread = 0; applyColors(null); $('offline').style.display = 'none'; render(); }
  function connect() {
    const s = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    ws = s;
    s.onopen = () => {
      if (ws !== s) return;
      $('offline').style.display = 'none';
      s.send(JSON.stringify({ type: 'join', mode: joinMsg.mode, room: joinMsg.room, board: joinMsg.board, initData: tg ? tg.initData : '', devId, name: devName }));
    };
    s.onmessage = (e) => {
      if (ws !== s) return;
      const m = JSON.parse(e.data);
      if (m.type === 'chat') {
        if (m.list) chat = m.list.slice(-60);
        else { chat.push(m.msg); chat = chat.slice(-60); if (!chatOpen && (!st || m.msg.seat !== st.me)) unread++; }
        if (!chatOpen && m.msg) render(); else renderChat();
      }
      else if (m.type === 'state') { if (!st) chatOpen = !m.started; applyColors(m.colors); st = m; joinMsg = { mode: 'join', room: m.room }; sel = -1; indexLegal(); render(); }
      else if (m.type === 'error') { toast(m.msg); if (m.code === 'noroom') toMenu(); }
    };
    s.onclose = () => {
      if (ws !== s) return;
      $('offline').style.display = 'block';
      setTimeout(() => { if (ws === s) connect(); }, 1500);
    };
  }
  let chat = [], chatOpen = false, unread = 0;
  const sendMsg = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
  function indexLegal() {
    legal = {};
    if (!st || !st.legal) return;
    for (const [from, to, pr] of st.legal) (legal[from] = legal[from] || []).push({ to, pr });
  }
  function toast(t) {
    const el = $('toast'); el.textContent = t; el.style.display = 'block';
    clearTimeout(toast.t); toast.t = setTimeout(() => (el.style.display = 'none'), 2600);
  }
  function ask(text, ok) {
    if (tg && tg.showConfirm) tg.showConfirm(text, (r) => r && ok());
    else if (confirm(text)) ok();
  }

  // ================= стартовое меню =================
  function parseCode(t) {
    t = String(t || '').trim();
    let m = t.match(/[?&](?:startapp|room|start)=([A-Za-z0-9]{3,8})/);
    if (m) return m[1].toUpperCase();

  // ================= окна: правила и фон =================
  function openModal(title, html) { $('mt').textContent = title; $('mb').innerHTML = html; $('modal').style.display = 'flex'; $('modal').querySelector('.sheet').scrollTop = 0; }

  const fig = (svg, cap) => `<div class="fig">${svg}<div>${cap}</div></div>`;
  const piecesOf = (list) => { const a = new Array(96).fill(null); for (const [c, o, t] of list) a[c] = '' + o + t; return a; };

  // куда пойдёт фигура на пустой доске (считает та же game.js, что и в партии)
  function reach(piece, c, attackOnly) {
    const g = { board: new Array(96).fill(null), alive: [true, true, true] };
    g.board[c] = piece;
    return G.gen(g, 0, attackOnly).map((m) => m.to);
  }
  const dots = (cells, color) => cells.map((c) => ({ c, color }));
  const pt = (P, S, c) => `${(P[c].ctr[0] * S).toFixed(1)},${(P[c].ctr[1] * S).toFixed(1)}`;
  // ломаные через центры клеток: линии горизонталей / вертикалей / диагоналей
  const lineDecor = (paths) => (S, view, P) => paths.map(({ cells, color, w }) => {
    const d = cells.map((c) => pt(P, S, c)).join(' ');
    return `<polyline class="np" points="${d}" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="${S * (w || 0.2) + 3}" stroke-linecap="round" stroke-linejoin="round"/>` +
           `<polyline class="np" points="${d}" fill="none" stroke="${color}" stroke-width="${S * (w || 0.2)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }).join('');
  const ringPath = (r) => { const a = []; for (let s = 0; s < 3; s++) for (let f = 0; f < 8; f++) a.push(cidx(s, f, r)); a.push(a[0]); return a; };
  const rayPath = (c, k, table) => [c].concat(table[c * 4 + k]);

  function rulesHtml() {
    // 1. карта линий — как на схеме: горизонтали, вертикали, диагонали
    const linesFig = mapSvg({
      view: 0, S: 36, pad: 0.6,
      decor: lineDecor([
        { cells: ringPath(0), color: '#f2c200' }, { cells: ringPath(2), color: '#f2c200' },
        { cells: rayPath(cidx(0, 2, 0), 0, G.ROOK_RAY), color: '#e03131' }, { cells: rayPath(cidx(0, 5, 0), 0, G.ROOK_RAY), color: '#e03131' },
        { cells: rayPath(cidx(0, 0, 0), 1, G.BISHOP_RAY), color: '#2f9e44' }, { cells: rayPath(cidx(0, 7, 0), 0, G.BISHOP_RAY), color: '#2f9e44' },
      ]),
    });
    const sw = (c, t) => `<span style="display:inline-block;width:22px;height:5px;border-radius:3px;background:${c};vertical-align:middle;margin-right:6px"></span>${t}`;
    // 2. ладья
    const rc = cidx(0, 5, 1);
    const rookFig = mapSvg({ S: 36, ps: 1.6, pieces: piecesOf([[rc, 0, 'R']]), marks: dots(reach({ t: 'R', o: 0 }, rc), '#2f80ed') });
    // 3. слон
    const bc = cidx(0, 2, 1);
    const bishopFig = mapSvg({ S: 36, ps: 1.6, pieces: piecesOf([[bc, 0, 'B']]), marks: dots(reach({ t: 'B', o: 0 }, bc), '#2f9e44') });
    // 4. ферзь
    const qc = cidx(0, 3, 0);
    const queenFig = mapSvg({ S: 36, ps: 1.6, pieces: piecesOf([[qc, 0, 'Q']]), marks: dots(reach({ t: 'Q', o: 0 }, qc), '#e8590c') });
    // 5. конь
    const nc = cidx(0, 6, 3);
    const knightFig = mapSvg({ S: 36, ps: 1.6, pieces: piecesOf([[nc, 0, 'N']]), marks: dots(reach({ t: 'N', o: 0 }, nc), '#9b51e0') });
    // 6. король
    const kc = cidx(0, 4, 3);
    const kingFig = mapSvg({ S: 36, ps: 1.6, pieces: piecesOf([[kc, 0, 'K']]), marks: dots(reach({ t: 'K', o: 0 }, kc), '#e0a100') });
    // 7. пешка: путь через центр в чужой сектор + взятия
    const pc = cidx(0, 5, 1), pawn = { t: 'P', o: 0, h: 0, st: true };
    const route = [];
    for (let cur = pc, h = 0, n = 0; n < 12; n++) {
      const fw = G.PFWD[cur * 4 + h]; if (!fw) break;
      route.push(fw.c); cur = fw.c; h = fw.h;
      if (G.secOf(cur) !== 0 && G.rankOf(cur) === 0) break;
    }
    const pawnMarks = dots(route.slice(0, -1), '#f2711c').concat([{ c: route[route.length - 1], color: '#f2711c', kind: 'star' }]);
    const caps = reach(pawn, pc, true);
    const pawnFig = mapSvg({ S: 36, ps: 1.6, pieces: piecesOf([[pc, 0, 'P']]), marks: pawnMarks.concat(caps.map((c) => ({ c, color: '#2f80ed', kind: 'ring' }))) });

    return `
    <h4>Доска</h4>
    <p>96 клеток: три сектора по 8×4, по одному у каждого игрока. В секторе 8 вертикалей (a–h слева направо) и 4 горизонтали: первая — ваша линия фигур, четвёртая — у центра. Ходят по часовой стрелке: белые → чёрные → красные. В игре ваш сектор всегда внизу.</p>
    ${fig(linesFig, `${sw('#f2c200', 'горизонтали')} &nbsp; ${sw('#e03131', 'вертикали')} &nbsp; ${sw('#2f9e44', 'диагонали')}`)}
    <ul>
      <li><b>Горизонтали</b> — замкнутые кольца из 24 клеток вокруг центра: правый край вашего сектора продолжается левым краем соседа справа, и так по кругу.</li>
      <li><b>Вертикали</b> идут к центру и там переходят в соседний сектор: правая половина (e–h) — в сектор справа, левая (a–d) — в сектор слева, зеркально (h→a, g→b, f→c, e→d). Дальше вертикаль идёт от центра к краю чужого сектора.</li>
      <li><b>Диагонали</b> тоже огибают центр и уходят в соседние сектора. В самом центре сходятся 6 клеток; диагональ, дошедшая до центра, продолжается на противоположной клетке.</li>
    </ul>

    <h4>Как ходят фигуры</h4>
    <p><b>♜ Ладья</b> — по вертикали и по горизонтали на любое число свободных клеток. Вертикаль продолжается через центр, горизонталь — по кольцу вокруг всей доски. Уже в начале партии угловая ладья смотрит по кольцу на угловую ладью соседа и может её взять.</p>
    ${fig(rookFig, 'Ладья и все её ходы на пустой доске')}
    <p><b>♝ Слон</b> — по диагоналям на любое число свободных клеток, в том числе через центр в соседние сектора.</p>
    ${fig(bishopFig, 'Слон и все его ходы на пустой доске')}
    <p><b>♛ Ферзь</b> — ходит как ладья и как слон.</p>
    ${fig(queenFig, 'Ферзь и все его ходы на пустой доске')}
    <p><b>♞ Конь</b> — «буквой Г»: две клетки в одну сторону и одна вбок. Перепрыгивает фигуры, в том числе через центр и стыки секторов.</p>
    ${fig(knightFig, 'Конь у центра: часть прыжков уходит в соседние сектора')}
    <p><b>♚ Король</b> — на одну клетку в любую сторону. У центра он может шагнуть и на клетки соседних секторов, которых касается углом.</p>
    ${fig(kingFig, 'Король у центра и все его ходы')}
    <p><b>♟ Пешка</b> — вперёд к центру на одну клетку (с первой линии — на одну или две), бьёт по диагонали вперёд. Дойдя до центра, переходит в соседний сектор и идёт там к его первой линии. Дойдя до неё, превращается в ферзя, ладью, слона или коня на ваш выбор.</p>
    ${fig(pawnFig, 'Путь пешки (оранжевые точки), ★ — клетка превращения; кольца — клетки, которые пешка бьёт')}

    <h4>Цель и конец партии</h4>
    <p>Шаха и мата нет — нужно <b>взять короля</b>. Король под ударом подсвечивается красным, но ходить можно как угодно, так что не зевайте. Игрок, потерявший короля, выбывает; его фигуры становятся серыми и остаются на доске: они не ходят, но их можно брать. Побеждает последний игрок с королём. Ничья — если ни у кого нет ходов или сыграно 450 ходов. Рокировки и взятия на проходе нет.</p>

    <h4>Управление</h4>
    <p>Коснитесь своей фигуры — подсветятся ходы (точка — ход, кольцо — взятие), затем коснитесь клетки. Жёлтым отмечен последний ход.</p>
    <div class="note">Боты играют простой жадной стратегией: берут то, что не защищено, и стараются не подставляться.</div>`;
  }
  $('bRules').onclick = () => openModal('Правила игры', withDefaults(() => (curVariant() === 't' ? tRulesHtml() : rulesHtml())));

  const BGS = [
    { id: 'tg', name: 'Как в Telegram', css: 'var(--tg-theme-bg-color, #16181d)', dark: true },
    { id: 'night', name: 'Ночь', css: '#14161b', dark: true },
    { id: 'felt', name: 'Сукно', css: 'radial-gradient(circle at 50% 30%, #2f6b4f, #143626)', dark: true },
    { id: 'ocean', name: 'Океан', css: 'linear-gradient(160deg, #1c3b6b, #0b1b36)', dark: true },
    { id: 'dusk', name: 'Закат', css: 'linear-gradient(160deg, #6b2a5b, #1f1a3d 60%, #0e1730)', dark: true },
    { id: 'wood', name: 'Дерево', css: 'linear-gradient(135deg, #7a5230, #4b2f18)', dark: true },
    { id: 'paper', name: 'Бумага', css: '#f3efe6', dark: false },
    { id: 'sky', name: 'Небо', css: 'linear-gradient(180deg, #dcebff, #f7fbff)', dark: false },
  ];
  let curBg = { id: 'tg' };
  function applyBg(o, save) {
    const r = document.documentElement.style;
    if (!o || o.id === 'tg') { ['--bgfill', '--fg', '--card', '--hint'].forEach((k) => r.removeProperty(k)); o = { id: 'tg' }; }
    else {
      r.setProperty('--bgfill', o.css);
      r.setProperty('--fg', o.dark ? '#eef1f6' : '#1c1f26');
      r.setProperty('--card', o.dark ? 'rgba(255,255,255,.12)' : 'rgba(0,0,0,.07)');
      r.setProperty('--hint', o.dark ? '#b9c0cc' : '#5b6372');
    }
    curBg = o;
    if (save) { try { localStorage.setItem('chess3bg', JSON.stringify(o)); } catch (e) {} }
  }
  function bgHtml() {
    const sws = BGS.map((b) => `<button class="sw${b.dark ? '' : ' light'}${curBg.id === b.id ? ' on' : ''}" data-bg="${b.id}" style="background:${b.css}">${b.name}</button>`).join('');
    const cv = curBg.id === 'custom' && /^#[0-9a-f]{6}$/i.test(curBg.css) ? curBg.css : '#14161b';
    return `<div class="sws">${sws}</div><label class="cust">Свой цвет <input type="color" id="bgc" value="${cv}"></label>`;
  }
  $('bBg').onclick = () => openModal('Фон', bgHtml());
  $('mb').addEventListener('click', (e) => {
    if (e.target.id === 'cres') { sendColors(true); $('pcol').value = DEF_COLORS[st.me]; $('fcol').value = DEF_FIELD[st.me]; return; }
    const b = e.target.closest('[data-bg]');
    if (!b) return;
    applyBg(BGS.find((x) => x.id === b.dataset.bg), true);
    $('mb').innerHTML = bgHtml();
  });
  $('mb').addEventListener('input', (e) => {
    if (e.target.id === 'pcol' || e.target.id === 'fcol') { sendColors(false); return; }
    if (e.target.id !== 'bgc') return;
    const c = e.target.value, n = parseInt(c.slice(1), 16);
    const lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
    applyBg({ id: 'custom', css: c, dark: lum < 0.55 }, true);
    document.querySelectorAll('.sw.on').forEach((x) => x.classList.remove('on'));
  });
  try { const saved = JSON.parse(localStorage.getItem('chess3bg') || 'null'); if (saved) applyBg(saved, false); } catch (e) {}

  // ================= доска «Т» =================
  const TS = 40;
  const tTint = (x, y) => (y >= 8 ? 0 : x <= 2 ? 1 : x >= 11 ? 2 : -1);
  /* o: me, pieces, alive, last, sel, targets[{c,cap}], check[], interactive */
  function tSvg(o) {
    const me = o.view || 0, S = TS, Wp = GT.W * S, Hp = GT.H * S, cw = Wp / 2, ch = Hp / 2;
    const ra = (me === 1 ? -90 : me === 2 ? 90 : 0) * Math.PI / 180, ca = Math.cos(ra), sa = Math.sin(ra);
    const rot = (x, y) => [cw + (x - cw) * ca - (y - ch) * sa, ch + (x - cw) * sa + (y - ch) * ca];
    const cells = [];
    for (let c = 0; c < GT.NC; c++) {
      const x = GT.xOf(c), y = GT.yOf(c);
      if (GT.valid(x, y)) cells.push({ c, x, y, q: [[x, y], [x + 1, y], [x + 1, y + 1], [x, y + 1]].map(([a, b]) => rot(a * S, b * S)), m: rot((x + 0.5) * S, (y + 0.5) * S) });
    }
    const prj = o.d3 ? makeProj([].concat(...cells.map((k) => k.q)), v3) : null;
    const tp = (p) => (prj ? prj.f(p[0], p[1]) : [p[0], p[1], 1, 0]);
    const info = {};
    for (const k of cells) { const m = tp(k.m); info[k.c] = { pts: k.q.map(tp), ctr: m, s: m[2], z: m[3] }; }
    const sq = prj ? prj.cp : 1;
    const poly = (c) => info[c].pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    let vx0 = 1e9, vy0 = 1e9, vx1 = -1e9, vy1 = -1e9;
    for (const k of cells) for (const p of info[k.c].pts) { vx0 = Math.min(vx0, p[0]); vx1 = Math.max(vx1, p[0]); vy0 = Math.min(vy0, p[1]); vy1 = Math.max(vy1, p[1]); }
    if (prj) { vx0 = prj.vb[0]; vy0 = prj.vb[1]; vx1 = vx0 + prj.vb[2]; vy1 = vy0 + prj.vb[3]; }
    let base = '', over = '', pcs = '';
    for (const k of cells) {
      base += `<polygon ${o.interactive ? `data-c="${k.c}"` : ''} points="${poly(k.c)}" fill="${(k.x + k.y) % 2 ? '#b58863' : '#ecd9b6'}"/>`;
      const t = tTint(k.x, k.y);
      if (t >= 0) base += `<polygon class="np" points="${poly(k.c)}" fill="${FIELD[t]}" opacity=".3"/>`;
    }
    if (o.last) for (const c of [o.last.from, o.last.to]) over += `<polygon class="np" points="${poly(c)}" fill="#ffe04d" opacity=".5"/>`;
    if (o.sel >= 0) over += `<polygon class="np" points="${poly(o.sel)}" fill="none" stroke="#2f80ed" stroke-width="3" stroke-linejoin="round"/>`;
    const order = cells.map((k) => k.c);
    if (prj) order.sort((a, b) => info[a].z - info[b].z);
    for (const c of order) {
      const pc = o.pieces && o.pieces[c];
      if (!pc) continue;
      const ow = +pc[0], [x, by, s] = info[c].ctr, dead = o.alive && !o.alive[ow];
      if (pc[1] === 'K' && o.check && o.check[ow] && o.alive[ow]) over += `<ellipse class="np" cx="${x}" cy="${by}" rx="${(S / 2 - 2) * s}" ry="${(S / 2 - 2) * s * sq}" fill="#ff3b30" opacity=".55"/>`;
      let y = by;
      if (prj) { y -= S * prj.sp * s * 0.4; pcs += `<ellipse class="np" cx="${x}" cy="${by}" rx="${S * 0.3 * s}" ry="${S * 0.3 * s * sq}" fill="#000" opacity=".3"/>`; }
      pcs += `<text class="np" x="${x}" y="${y + 1}" text-anchor="middle" dominant-baseline="central" font-size="${(S - 4) * s}"
        fill="${dead ? DEAD : COLORS[ow]}" stroke="${dead ? '#444' : STROKE[ow]}" stroke-width="1.3" paint-order="stroke">${GLYPH[pc[1]]}︎</text>`;
    }
    for (const m of o.targets || []) {
      const [x, y, s] = info[m.c].ctr;
      over += m.cap ? `<ellipse class="np" cx="${x}" cy="${y}" rx="${(S / 2 - 3) * s}" ry="${(S / 2 - 3) * s * sq}" fill="none" stroke="#2f80ed" stroke-width="3.5"/>`
                    : `<ellipse class="np" cx="${x}" cy="${y}" rx="${6 * s}" ry="${6 * s * sq}" fill="#2f80ed" opacity=".8"/>`;
    }
    return `<svg viewBox="${vx0.toFixed(1)} ${vy0.toFixed(1)} ${(vx1 - vx0).toFixed(1)} ${(vy1 - vy0).toFixed(1)}" xmlns="http://www.w3.org/2000/svg">${base}${over}${pcs}</svg>`;
  }
  function tBoardFig() {
    const s = 20;
    let c = '';
    for (let y = 0; y < GT.H; y++) for (let x = 0; x < GT.W; x++) {
      if (!GT.valid(x, y)) continue;
      c += `<rect x="${x * s}" y="${y * s}" width="${s}" height="${s}" fill="${(x + y) % 2 ? '#b58863' : '#ecd9b6'}"/>`;
      const t = tTint(x, y);
      if (t >= 0) c += `<rect x="${x * s}" y="${y * s}" width="${s}" height="${s}" fill="${COLORS[t]}" opacity=".38"/>`;
    }
    const dash = (x1, y1, x2, y2, p) =>
      `<line x1="${x1 * s}" y1="${y1 * s}" x2="${x2 * s}" y2="${y2 * s}" stroke="${STROKE[p]}" stroke-width="5" stroke-dasharray="6 4"/>` +
      `<line x1="${x1 * s}" y1="${y1 * s}" x2="${x2 * s}" y2="${y2 * s}" stroke="${COLORS[p]}" stroke-width="3" stroke-dasharray="6 4"/>`;
    const arrow = (x1, y1, x2, y2, p) =>
      `<line x1="${x1 * s}" y1="${y1 * s}" x2="${x2 * s}" y2="${y2 * s}" stroke="${STROKE[p]}" stroke-width="7" stroke-linecap="round"/>` +
      `<line x1="${x1 * s}" y1="${y1 * s}" x2="${x2 * s}" y2="${y2 * s}" stroke="${COLORS[p]}" stroke-width="4" stroke-linecap="round" marker-end="url(#ah${p})"/>`;
    const marks = COLORS.map((k, p) => `<marker id="ah${p}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="${k}" stroke="${STROKE[p]}" stroke-width="1.6"/></marker>`).join('');
    c += dash(3, 0, 11, 0, 0) + dash(11, 0, 11, 8, 1) + dash(3, 0, 3, 8, 2);
    c += arrow(7, 10.6, 7, 4.5, 0) + arrow(0.5, 1.8, 5.5, 1.8, 1) + arrow(13.5, 6.2, 8.5, 6.2, 2);
    const lab = (t, x, y) => `<text x="${x * s}" y="${y * s}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1c1f26" stroke="#fff" stroke-width="2.4" paint-order="stroke">${t}</text>`;
    c += lab(NAMES[0], 7, 9.6) + lab(NAMES[1], 1.5, 4.6) + lab(NAMES[2], 12.5, 3.6);
    return fig(`<svg viewBox="-6 -6 292 232" xmlns="http://www.w3.org/2000/svg"><defs>${marks}</defs>${c}</svg>`,
      'Стрелки — куда идут пешки каждого цвета. Пунктир — линия, на которой пешка того же цвета превращается.');
  }
  // ходы фигуры на пустой доске «Т»
  function tReach(t, c) {
    const g = { board: new Array(GT.NC).fill(null), alive: [true, true, true] };
    g.board[c] = { t, o: 0 };
    return GT.gen(g, 0, false).map((m) => m.to);
  }
  function tPieceFig(t, at, color) {
    const pcs = new Array(GT.NC).fill(null); pcs[at] = '0' + t;
    return fig(tSvg({ view: 0, pieces: pcs, alive: [true, true, true], targets: tReach(t, at).map((c) => ({ c, cap: false })) }), '');
  }
  function tRulesHtml() {
    const at = GT.idx(6, 4);
    return `
    <h4>Доска</h4>
    <p>Доска в форме буквы «Т»: центральное поле 8×8 и три рукава по 3×8 клеток — у каждого игрока свой, с 16 фигурами. Четвёртой стороны нет. Ходят по очереди: белые (внизу) → красные (слева) → чёрные (справа). В игре ваш рукав всегда внизу.</p>
    ${tBoardFig()}
    <h4>Как ходят фигуры</h4>
    <p>Фигуры ходят как в обычных шахматах, только по доске «Т»: за край доски ходить нельзя, но через центр можно.</p>
    <p><b>♜ Ладья</b> — по прямой по горизонтали и вертикали на любое число свободных клеток.</p>
    ${tPieceFig('R', at)}
    <p><b>♝ Слон</b> — по диагоналям на любое число свободных клеток.</p>
    ${tPieceFig('B', at)}
    <p><b>♛ Ферзь</b> — как ладья и слон вместе.</p>
    ${tPieceFig('Q', at)}
    <p><b>♞ Конь</b> — «буквой Г»: две клетки в одну сторону и одна вбок; перепрыгивает фигуры.</p>
    ${tPieceFig('N', at)}
    <p><b>♚ Король</b> — на одну клетку в любую сторону.</p>
    ${tPieceFig('K', at)}
    <p><b>♟ Пешка</b> идёт к центру и дальше: нижняя — вверх, левая — вправо, правая — влево. На одну клетку вперёд (с начальной линии можно на две), бьёт по диагонали вперёд. Дойдя до дальнего края центрального поля 8×8 (пунктир на схеме), превращается в ферзя, ладью, слона или коня на ваш выбор.</p>
    <h4>Цель и конец партии</h4>
    <p>Шаха и мата нет — нужно <b>взять короля</b>. Король под ударом подсвечивается красным, но ходить можно как угодно, так что не зевайте. Игрок, потерявший короля, выбывает; его фигуры становятся серыми и остаются на доске: не ходят, но их можно брать. Побеждает последний игрок с королём. Ничья — если ни у кого нет ходов или сыграно 450 ходов. Рокировки и взятия на проходе нет.</p>
    <h4>Управление</h4>
    <p>Коснитесь своей фигуры — подсветятся ходы (точка — ход, кольцо — взятие), затем коснитесь клетки. Жёлтым отмечен последний ход.</p>
    <div class="note">Боты играют простой жадной стратегией: берут то, что не защищено, и стараются не подставляться.</div>`;
  }

  // ================= экран игры =================
  function addBtn(label, fn, sec) {
    const b = document.createElement('button');
    b.textContent = label; if (sec) b.className = 'sec'; b.onclick = fn;
    $('actions').appendChild(b);
  }

  function render() {
    renderChat();
    const seatsEl = $('seats'), lobby = $('lobby'), wrap = $('boardWrap'), status = $('status');
    $('actions').innerHTML = ''; status.className = '';

    if (!st) {
      $('menu').style.display = joinMsg ? 'none' : 'flex';
      seatsEl.style.display = 'none'; lobby.style.display = 'none'; wrap.style.display = 'none';
      status.textContent = joinMsg ? 'Подключаюсь…' : '';
      if (joinMsg) addBtn('Отмена', toMenu, true);
      return;
    }
    $('menu').style.display = 'none';
    seatsEl.style.display = 'flex';

    const names = st.seats;
    const label = (p) => {
      const s = names[p];
      if (!s) return 'ждём игрока…';
      return (s.bot ? '🤖 ' : '') + s.name + (p === st.me ? ' (вы)' : '');
    };
    seatsEl.innerHTML = [0, 1, 2].map((p) => {
      const cls = ['chip'];
      if (st.started && st.turn === p && !st.over && st.alive[p]) cls.push('turn');
      if (st.started && !st.alive[p]) cls.push('dead');
      return `<div class="${cls.join(' ')}"><span class="dot" style="background:${COLORS[p]}"></span><span class="nm">${esc(label(p))}</span></div>`;
    }).join('');

    if (!st.started) {
      wrap.style.display = 'none'; lobby.style.display = 'flex';
      const n = names.filter(Boolean).length;
      lobby.innerHTML = `<div class="hint">Комната</div><div class="code">${esc(st.room)}</div>
        <div>Игроков: ${n} из 3</div>
        <div class="hint">${st.me >= 0 ? 'Отправьте приглашение друзьям — игра начнётся, когда соберутся трое. Или добавьте ботов на свободные места.' : 'Комната ждёт игроков.'}</div>`;
      status.textContent = '';
      if (st.me >= 0) { addBtn('Пригласить друзей', invite); addBtn('Добавить ботов', () => sendMsg({ type: 'fillbots' }), true); }
      commonBtns();
      addBtn('В меню', toMenu, true);
      return;
    }
    lobby.style.display = 'none'; wrap.style.display = 'flex';
    drawBoard();

    if (st.over) {
      status.textContent = st.draw ? 'Ничья' : st.winner === st.me ? '🏆 Вы победили!' : `Победил ${names[st.winner] ? names[st.winner].name : 'игрок'}`;
      if (st.me >= 0) addBtn('Играть ещё', () => sendMsg({ type: 'rematch' }));
    } else {
      const mine = st.me >= 0 && st.turn === st.me;
      if (st.me >= 0 && !st.alive[st.me]) status.textContent = 'Вы выбыли — наблюдаете за игрой';
      else if (mine) { status.textContent = st.check[st.me] ? 'Ваш ход. Королю угрожают!' : 'Ваш ход'; if (st.check[st.me]) status.className = 'warn'; }
      else status.textContent = 'Ходит ' + (names[st.turn] ? names[st.turn].name : '…');
      if (st.me >= 0 && st.alive[st.me]) addBtn('Сдаться', () => ask('Сдаться? Ваши фигуры останутся на доске.', () => sendMsg({ type: 'resign' })), true);
    }
    commonBtns();
    addBtn('В меню', toMenu, true);
  }

  function commonBtns() {
    if (st.me >= 0) addBtn('🎨 Цвета', () => openModal('Цвета', colorsHtml()), true);
    addBtn('💬 Чат' + (unread ? ` (${unread})` : ''), () => { chatOpen = !chatOpen; unread = 0; render(); }, true);
    if (v3.on && st.started) addBtn('Сбросить вид', () => { v3.yaw = 0; v3.pitch = 0.95; saveV3(); drawBoard(); }, true);
  }

  // ---- чат
  function renderChat() {
    const box = $('chat');
    box.style.display = st && chatOpen ? 'flex' : 'none';
    if (!st || !chatOpen) return;
    const log = $('chatLog');
    log.innerHTML = chat.map((m) => `<div class="cm"><span class="cd" style="background:${m.seat >= 0 ? COLORS[m.seat] : '#999'}"></span><b>${esc(m.name)}:</b> ${esc(m.text)}</div>`).join('')
      || '<div class="hint">Сообщений пока нет. Напишите первым!</div>';
    log.scrollTop = log.scrollHeight;
  }
  function sendChat() {
    const t = $('chatIn').value.trim();
    if (!t) return;
    sendMsg({ type: 'chat', text: t });
    $('chatIn').value = '';
  }
  $('chatSend').onclick = sendChat;
  $('chatIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });

  // ---- цвета фигур и поля
  function colorsHtml() {
    const me = st.me, cur = (st.colors && st.colors[me]) || {};
    return `<label class="cust">Цвет фигур <input type="color" id="pcol" value="${cur.piece || DEF_COLORS[me]}"></label>
      <label class="cust">Цвет вашего поля <input type="color" id="fcol" value="${cur.field || DEF_FIELD[me]}"></label>
      <button class="sec" id="cres">Сбросить цвета</button><div class="note">Цвета видны всем игрокам в комнате.</div>`;
  }
  let colTimer = null;
  function sendColors(reset) {
    clearTimeout(colTimer);
    colTimer = setTimeout(() => sendMsg({ type: 'color', piece: reset ? null : $('pcol').value, field: reset ? null : $('fcol').value }), 120);
  }

  // ---- вид 3D и вращение доски
  const bView = $('bView');
  const markView = () => { bView.textContent = v3.on ? '2D' : '3D'; };
  markView();
  bView.onclick = () => {
    v3.on = !v3.on; saveV3(); markView();
    if (v3.on) toast('Тяните доску пальцем, чтобы повернуть и наклонить');
    if (st && st.started) { drawBoard(); render(); }
  };
  let drawPend = false;
  const redraw = () => { if (drawPend) return; drawPend = true; requestAnimationFrame(() => { drawPend = false; if (st && st.started) drawBoard(); }); };
  (() => {
    const w = $('boardWrap');
    let down = null;
    w.addEventListener('pointerdown', (e) => { if (e.button > 0) return; down = { x: e.clientX, y: e.clientY, yaw: v3.yaw, pitch: v3.pitch, drag: false }; });
    window.addEventListener('pointermove', (e) => {
      if (!down || !v3.on) return;
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (!down.drag && Math.hypot(dx, dy) > 6) down.drag = true;
      if (down.drag) { v3.yaw = down.yaw + dx * 0.012; v3.pitch = Math.max(0.25, Math.min(1.4, down.pitch + dy * 0.008)); redraw(); }
    });
    window.addEventListener('pointerup', (e) => {
      if (!down) return;
      const d = down; down = null;
      if (d.drag) { saveV3(); return; }
      const el = document.elementFromPoint(e.clientX, e.clientY), cell = el && el.closest && el.closest('[data-c]');
      if (cell && w.contains(cell)) onTap(cell);
    });
    window.addEventListener('pointercancel', () => { down = null; });
  })();

  function drawBoard() {
    const targets = sel >= 0 ? (legal[sel] || []).map((m) => ({ c: m.to, cap: !!st.board[m.to] })) : [];
    const o = {
      view: st.me >= 0 ? st.me : 0, S: 30, pieces: st.board, alive: st.alive, check: st.check,
      last: st.last, sel, targets, interactive: true, d3: v3.on,
    };
    $('boardWrap').innerHTML = st.variant === 't' ? tSvg(o) : mapSvg(o);
    $('boardWrap').classList.toggle('d3', v3.on);
  }

  function onTap(el) {
    if (!el || !st || st.over) return;
    const c = +el.dataset.c;
    if (sel >= 0) {
      const m = (legal[sel] || []).find((q) => q.to === c);
      if (m) {
        const from = sel;
        if (m.pr) return askPromo((promo) => { sendMsg({ type: 'move', from, to: c, promo }); sel = -1; });
        sendMsg({ type: 'move', from, to: c }); sel = -1; return;
      }
    }
    sel = legal[c] ? c : -1;
    drawBoard();
  }

  function askPromo(cb) {
    const box = $('promo').querySelector('.box');
    box.innerHTML = '';
    for (const t of ['Q', 'R', 'B', 'N']) {
      const b = document.createElement('button');
      b.textContent = GLYPH[t] + '︎';
      b.onclick = () => { $('promo').style.display = 'none'; cb(t); };
      box.appendChild(b);
    }
    $('promo').style.display = 'flex';
  }

  // ================= старт =================
  render();
  if (linkRoom) startJoin({ mode: 'join', room: String(linkRoom).toUpperCase() });
})();
</script>
</body>
</html>
